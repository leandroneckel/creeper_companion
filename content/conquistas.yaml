# Conquistas: quando o contador chega na meta, aparece "Conquista feita!" e ele ganha o XP.
#
# Contadores disponíveis:
#   comeu, bebeu, comidas_diferentes, bebidas_diferentes, atividades, atividades_diferentes,
#   dancou, gato, carinhos, explosoes, acalmou (acalmou enquanto chiava), tonto, presentes,
#   maca_dourada, tudo_cheio (todas as necessidades acima de 90), agua_feita, pausas_feitas
#   (você apertou "Fiz!"), agua_seguidos (dias seguidos bebendo água), dias_juntos, nivel,
#   blocos (minerados), diamantes, peixes, tesouros (pescados), plantou, porco, fogos, pocoes_diferentes
# "icone" é um dos ícones de creeper/art/icons.py.

conquistas:
  - id: primeira_mordida
    nome: Primeira mordida
    descricao: Dê comida pro creeper.
    contador: comeu
    meta: 1
    xp: 10
    icone: maca

  - id: chef_de_bloco
    nome: Chef de bloco
    descricao: Dê 10 comidas diferentes.
    contador: comidas_diferentes
    meta: 10
    xp: 50
    icone: bolo

  - id: atleta
    nome: Atleta de bioma
