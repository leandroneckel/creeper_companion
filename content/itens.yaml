# Itens que dá pra oferecer ao creeper.
#
# "efeitos" são somados às necessidades (escala 0-100, onde 100 = totalmente satisfeito):
#   fome     -> saciedade (positivo = mata a fome)
#   sede     -> hidratação
#   energia  -> disposição física (negativo = cansa)
#   sono     -> descanso (positivo = tira o sono)
#   diversao -> diversão
#
# "status" aplica um efeito temporário: dourado, enjoado, cafeinado, velocidade, salto, encolhido, invisivel.
# "cura: true" remove os efeitos ruins (enjoado, cafeinado).
# "desemburra: true" tira o emburrado, a irritação e o chamuscado.
# "duracao" (atividades) é em segundos.
# "nivel" (opcional): nível em que o item é desbloqueado. Sem ele, está liberado desde o começo.
# "limitado" (opcional): o item tem quantidade em vez de ser infinito.
#   inicial  -> quantas unidades você ganha quando o item aparece pela primeira vez
#   peso     -> chance relativa de vir num presente
#   presente -> quantas unidades vêm num presente

